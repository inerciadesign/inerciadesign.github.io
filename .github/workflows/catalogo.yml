name: Armar catálogo

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'scripts/armar-catalogo.js'
  pull_request:
    paths:
      - 'content/**'
      - 'assets/**'
      - 'scripts/armar-catalogo.js'

permissions:
  contents: write

concurrency:
  group: commits-del-bot
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar y generar products.json
        run: node scripts/armar-catalogo.js

      - name: Commitear products.json
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --staged --quiet; then
            echo "products.json ya estaba al día."
          else
            git commit -m "Actualiza products.json desde content/"
            git pull --rebase
            git push
          fi
